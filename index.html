<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商旅 ROI 智能建模引擎 v3.0</title>
    
    <!-- 使用 Tailwind CSS 官方运行时 (国内访问流畅，无外部依赖) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 引入国内可靠的 Staticfile CDN (七牛云) -->
    <script crossorigin src="https://cdn.staticfile.net/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdn.staticfile.net/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script crossorigin src="https://cdn.staticfile.net/babel-standalone/7.23.3/babel.min.js"></script>

    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
        /* 隐藏滚动条但保留滚动功能 */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900">
    <!-- React 挂载点 -->
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo } = React;

        // ==========================================
        // 0. 内联图标库 (无需依赖任何外部图标 API/CDN)
        // ==========================================
        const Icon = ({ name, size = 24, className = "" }) => {
            const svgProps = {
                xmlns: "http://www.w3.org/2000/svg",
                width: size, height: size, viewBox: "0 0 24 24",
                fill: "none", stroke: "currentColor", strokeWidth: "2",
                strokeLinecap: "round", strokeLinejoin: "round",
                className: className
            };

            const paths = {
                database: <><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5V19A9 3 0 0 0 21 19V5"/><path d="M3 12A9 3 0 0 0 21 12"/></>,
                calculator: <><rect width="16" height="20" x="4" y="2" rx="2"/><line x1="8" x2="16" y1="6" y2="6"/><line x1="16" x2="16" y1="14" y2="18"/><path d="M16 10h.01"/><path d="M12 10h.01"/><path d="M8 10h.01"/><path d="M12 14h.01"/><path d="M8 14h.01"/><path d="M12 18h.01"/><path d="M8 18h.01"/></>,
                pieChart: <><path d="M21.21 15.89A10 10 0 1 1 8 2.83"/><path d="M22 12A10 10 0 0 0 12 2v10z"/></>,
                trendingUp: <><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></>,
                checkCircle: <><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></>,
                building: <><path d="M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18Z"/><path d="M6 12H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2"/><path d="M18 9h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-2"/><path d="M10 6h4"/><path d="M10 10h4"/><path d="M10 14h4"/><path d="M10 18h4"/></>,
                plane: <><path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.2-1.1.7l-1.3 2.6c-.2.4-.1.9.3 1.1L9 14l-4 4-2.6-1.3c-.4-.2-.9-.1-1.1.3l-1.1 2.2c-.1.5.2.9.7 1.1l5.5 1.4 1.4 5.5c.2.5.6.8 1.1.7l2.2-1.1c.4-.2.5-.7.3-1.1L10 20l4-4 3.4 6.3c.2.4.7.5 1.1.3l2.6-1.3c.5-.2.8-.7.7-1.1Z"/></>,
                train: <><rect width="16" height="16" x="4" y="3" rx="2"/><path d="M4 11h16"/><path d="M12 3v8"/><path d="m8 19-2 3"/><path d="m18 22-2-3"/><path d="M8 15h0"/><path d="M16 15h0"/></>,
                info: <><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></>,
                arrowRight: <><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></>,
                alertCircle: <><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></>,
                clock: <><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></>
            };

            return <svg {...svgProps}>{paths[name]}</svg>;
        };

        // ==========================================
        // 1. 主程序组件
        // ==========================================
        const SmartROIEngine = () => {
            const [activeTab, setActiveTab] = useState('analysis');

            const [inputData, setInputData] = useState({
                annualBudget: 35500000,
                categorySplit: { air: 45, hotel: 28, train: 27 },
                orderCount: 12000,
                avgSalary: 20000,
                efficiency: { oldTime: 30, newTime: 5 }
            });

            // 核心逻辑计算引擎
            const report = useMemo(() => {
                const { annualBudget, categorySplit, orderCount, avgSalary, efficiency } = inputData;
                
                const airBudget = annualBudget * (categorySplit.air / 100);
                const hotelBudget = annualBudget * (categorySplit.hotel / 100);
                const trainBudget = annualBudget * (categorySplit.train / 100);

                const hourlyRate = avgSalary / 21.75 / 8;
                const timeSavedPerOrder = (efficiency.oldTime - efficiency.newTime) / 60;
                const totalLaborSavings = timeSavedPerOrder * orderCount * hourlyRate;
                
                const laborSplit = { air: 0.3, hotel: 0.4, train: 0.3 };

                // 1. 机票
                const airMatrix = {
                    budget: airBudget,
                    controlRate: 0.15,
                    controlAmount: airBudget * 0.15,
                    resourceRate: 0.062,
                    resourceAmount: airBudget * 0.062,
                    laborAmount: totalLaborSavings * laborSplit.air
                };
                airMatrix.total = airMatrix.controlAmount + airMatrix.resourceAmount + airMatrix.laborAmount;
                airMatrix.roi = (airMatrix.total / airMatrix.budget) || 0;

                // 2. 酒店
                const hotelResourceRate = 0.4 * 0.2; // 0.08
                const hotelMatrix = {
                    budget: hotelBudget,
                    controlRate: 0.169,
                    controlAmount: hotelBudget * 0.169,
                    resourceRate: hotelResourceRate,
                    resourceAmount: hotelBudget * hotelResourceRate,
                    laborAmount: totalLaborSavings * laborSplit.hotel
                };
                hotelMatrix.total = hotelMatrix.controlAmount + hotelMatrix.resourceAmount + hotelMatrix.laborAmount;
                hotelMatrix.roi = (hotelMatrix.total / hotelMatrix.budget) || 0;

                // 3. 火车
                const trainMatrix = {
                    budget: trainBudget,
                    controlRate: 0.05,
                    controlAmount: trainBudget * 0.05,
                    resourceRate: 0,
                    resourceAmount: 0,
                    laborAmount: totalLaborSavings * laborSplit.train
                };
                trainMatrix.total = trainMatrix.controlAmount + trainMatrix.resourceAmount + trainMatrix.laborAmount;
                trainMatrix.roi = (trainMatrix.total / trainMatrix.budget) || 0;

                const totalSavings = airMatrix.total + hotelMatrix.total + trainMatrix.total;
                const totalROI = totalSavings / annualBudget;

                return {
                    air: airMatrix,
                    hotel: hotelMatrix,
                    train: trainMatrix,
                    laborTotal: totalLaborSavings,
                    grandTotal: totalSavings,
                    grandROI: (totalROI * 100).toFixed(1)
                };
            }, [inputData]);

            // ==========================================
            // 2. 渲染模块
            // ==========================================
            
            // Tab 1: 数据输入
            const renderInput = () => (
                <div className="grid grid-cols-1 md:grid-cols-12 gap-6 transition-all duration-500">
                    <div className="md:col-span-8 bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
                        <div className="flex items-center gap-2 mb-6 border-b pb-4">
                            <Icon name="database" className="text-blue-600" size={20}/>
                            <h3 className="font-bold text-slate-800">基础财务数据输入</h3>
                        </div>
                        <div className="space-y-6">
                            <div>
                                <label className="block text-sm font-semibold text-slate-700 mb-2">年度商旅总预算 (¥)</label>
                                <input 
                                    type="number" 
                                    value={inputData.annualBudget}
                                    onChange={e => setInputData({...inputData, annualBudget: Number(e.target.value)})}
                                    className="w-full text-2xl font-mono text-blue-600 bg-slate-50 border border-slate-300 rounded-lg px-4 py-3 focus:ring-2 focus:ring-blue-500 outline-none transition-all"
                                />
                            </div>
                            <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                                {['air', 'hotel', 'train'].map(type => (
                                    <div key={type} className="bg-slate-50 p-4 rounded-lg border border-slate-200 relative overflow-hidden group hover:shadow-md transition-shadow">
                                        <div className="absolute top-0 right-0 p-2 opacity-10 group-hover:opacity-20 transition-opacity text-slate-800">
                                            <Icon name={type === 'air' ? 'plane' : type === 'hotel' ? 'building' : 'train'} size={40}/>
                                        </div>
                                        <label className="block text-xs font-bold uppercase text-slate-500 mb-1">
                                            {type === 'air' ? '机票占比' : type === 'hotel' ? '酒店占比' : '火车占比'} (%)
                                        </label>
                                        <input 
                                            type="number"
                                            value={inputData.categorySplit[type]}
                                            onChange={e => setInputData({
                                                ...inputData, 
                                                categorySplit: {...inputData.categorySplit, [type]: Number(e.target.value)}
                                            })}
                                            className="w-full bg-transparent text-xl font-bold text-slate-800 border-b-2 border-slate-300 focus:border-blue-500 outline-none pb-1 font-mono relative z-10"
                                        />
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>

                    <div className="md:col-span-4 bg-white p-6 rounded-xl border border-slate-200 shadow-sm flex flex-col">
                        <div className="flex items-center gap-2 mb-6 border-b pb-4">
                            <Icon name="calculator" className="text-emerald-600" size={20}/>
                            <h3 className="font-bold text-slate-800">人效参数模型</h3>
                        </div>
                        <div className="space-y-5 flex-grow">
                            <div>
                               <label className="block text-xs font-semibold text-slate-500 mb-1">年订单总量 (单)</label>
                               <input 
                                 type="number" 
                                 value={inputData.orderCount}
                                 onChange={e => setInputData({...inputData, orderCount: Number(e.target.value)})}
                                 className="w-full px-3 py-2 bg-slate-50 rounded border border-slate-200 font-mono text-slate-700 focus:ring-2 focus:ring-emerald-500 outline-none"
                               />
                            </div>
                            <div>
                               <label className="block text-xs font-semibold text-slate-500 mb-1">平均月薪 (元)</label>
                               <input 
                                 type="number" 
                                 value={inputData.avgSalary}
                                 onChange={e => setInputData({...inputData, avgSalary: Number(e.target.value)})}
                                 className="w-full px-3 py-2 bg-slate-50 rounded border border-slate-200 font-mono text-slate-700 focus:ring-2 focus:ring-emerald-500 outline-none"
                               />
                            </div>
                            <div className="pt-4 border-t border-dashed">
                                <div className="flex justify-between text-sm mb-2">
                                    <span className="text-slate-500">单单耗时优化:</span>
                                    <span className="font-bold text-emerald-600 font-mono">
                                        {inputData.efficiency.oldTime}min → {inputData.efficiency.newTime}min
                                    </span>
                                </div>
                                <div className="text-xs text-slate-400 bg-emerald-50 p-2 rounded text-center">
                                    基于行业标准：报销/审批/预订全流程
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );

            // Tab 2: 智能分析
            const renderAnalysis = () => (
                <div className="space-y-8 transition-all duration-500">
                    <div className="bg-slate-900 text-white p-8 rounded-2xl shadow-xl relative overflow-hidden">
                        <div className="absolute top-0 right-0 w-64 h-64 bg-blue-600 rounded-full blur-3xl opacity-20 -mr-16 -mt-16"></div>
                        <div className="relative z-10 grid grid-cols-1 md:grid-cols-3 gap-8 text-center md:text-left">
                            <div>
                                <div className="text-slate-400 text-xs font-bold uppercase tracking-widest mb-2">Potential Savings</div>
                                <div className="text-4xl md:text-5xl font-black text-white tracking-tight">
                                    ¥{(report.grandTotal / 10000).toFixed(1)}<span className="text-xl font-normal text-slate-400 ml-1">万</span>
                                </div>
                                <div className="mt-2 text-emerald-400 font-medium flex items-center justify-center md:justify-start gap-1">
                                    <Icon name="trendingUp" size={16}/> 综合节省率 {report.grandROI}%
                                </div>
                            </div>
                            <div className="md:border-l md:border-slate-700 md:pl-8">
                                <div className="text-slate-400 text-xs font-bold uppercase tracking-widest mb-2">Efficiency Gain</div>
                                <div className="text-3xl font-bold text-blue-400">
                                    ¥{(report.laborTotal / 10000).toFixed(1)}<span className="text-lg font-normal text-slate-400 ml-1">万</span>
                                </div>
                                <p className="text-xs text-slate-500 mt-2">释放财务与员工生产力折算</p>
                            </div>
                            <div className="md:border-l md:border-slate-700 md:pl-8 flex flex-col justify-center">
                               <button className="bg-white text-slate-900 hover:bg-blue-50 font-bold py-3 px-6 rounded-xl transition-colors flex items-center justify-center gap-2 w-full group">
                                   <Icon name="checkCircle" className="text-blue-600" size={18}/>
                                   导出详细分析报告
                                   <Icon name="arrowRight" className="opacity-0 group-hover:opacity-100 transition-all -ml-2 group-hover:ml-0 text-slate-400" size={16}/>
                               </button>
                            </div>
                        </div>
                    </div>

                    <div className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                        <div className="p-6 border-b border-slate-100 flex flex-col sm:flex-row justify-between items-start sm:items-center bg-slate-50/50 gap-4">
                            <div>
                                <h3 className="font-bold text-lg text-slate-800">全品类节省归因矩阵 (Attribution Matrix)</h3>
                                <p className="text-xs text-slate-500 mt-1">数据基于实时输入动态测算，逻辑闭环</p>
                            </div>
                            <div className="text-[10px] bg-slate-200 text-slate-600 px-2 py-1 rounded font-mono">
                                Unit: CNY
                            </div>
                        </div>
                        <div className="overflow-x-auto no-scrollbar">
                            <table className="w-full text-sm text-left min-w-[800px]">
                                <thead className="text-xs text-slate-500 uppercase bg-slate-50 border-b border-slate-200">
                                    <tr>
                                        <th className="px-6 py-4 font-medium">品类</th>
                                        <th className="px-6 py-4 font-medium">年化预算</th>
                                        <th className="px-6 py-4 font-medium bg-blue-50/30 text-blue-700">预估总节省</th>
                                        <th className="px-6 py-4 font-medium w-1/5">管控节省 <span className="text-[10px] text-slate-400 block normal-case">Policy Control</span></th>
                                        <th className="px-6 py-4 font-medium w-1/5">资源节省 <span className="text-[10px] text-slate-400 block normal-case">Supply Chain</span></th>
                                        <th className="px-6 py-4 font-medium w-1/5">效能节省 <span className="text-[10px] text-slate-400 block normal-case">Efficiency</span></th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-slate-100">
                                    <tr className="hover:bg-slate-50 transition-colors">
                                        <td className="px-6 py-4 font-bold text-slate-700 flex items-center gap-2">
                                            <Icon name="plane" className="text-blue-500" size={16}/> 机票
                                        </td>
                                        <td className="px-6 py-4 font-mono text-slate-600">¥{(report.air.budget/10000).toFixed(1)}W</td>
                                        <td className="px-6 py-4 font-mono font-bold text-blue-600 bg-blue-50/10">
                                            ¥{(report.air.total/10000).toFixed(1)}W
                                            <span className="ml-2 text-xs font-normal bg-blue-100 text-blue-700 px-1.5 py-0.5 rounded">{(report.air.roi * 100).toFixed(1)}%</span>
                                        </td>
                                        <td className="px-6 py-4 text-slate-600">
                                            <div className="font-mono">¥{(report.air.controlAmount/10000).toFixed(2)}W</div>
                                            <div className="text-[10px] text-slate-400 mt-0.5">预订限制/低价逻辑</div>
                                        </td>
                                        <td className="px-6 py-4 text-slate-600">
                                            <div className="font-mono">¥{(report.air.resourceAmount/10000).toFixed(2)}W</div>
                                            <div className="text-[10px] text-slate-400 mt-0.5">三方协议/返点</div>
                                        </td>
                                        <td className="px-6 py-4 text-slate-600">
                                            <div className="font-mono">¥{(report.air.laborAmount/10000).toFixed(2)}W</div>
                                        </td>
                                    </tr>
                                    <tr className="hover:bg-slate-50 transition-colors">
                                        <td className="px-6 py-4 font-bold text-slate-700 flex items-center gap-2">
                                            <Icon name="building" className="text-emerald-500" size={16}/> 酒店
                                        </td>
                                        <td className="px-6 py-4 font-mono text-slate-600">¥{(report.hotel.budget/10000).toFixed(1)}W</td>
                                        <td className="px-6 py-4 font-mono font-bold text-emerald-600 bg-blue-50/10">
                                            ¥{(report.hotel.total/10000).toFixed(1)}W
                                            <span className="ml-2 text-xs font-normal bg-emerald-100 text-emerald-700 px-1.5 py-0.5 rounded">{(report.hotel.roi * 100).toFixed(1)}%</span>
                                        </td>
                                        <td className="px-6 py-4 text-slate-600">
                                            <div className="font-mono">¥{(report.hotel.controlAmount/10000).toFixed(2)}W</div>
                                            <div className="text-[10px] text-slate-400 mt-0.5">差标/合住管控</div>
                                        </td>
                                        <td className="px-6 py-4 text-slate-600">
                                            <div className="font-mono">¥{(report.hotel.resourceAmount/10000).toFixed(2)}W</div>
                                            <div className="text-[10px] text-slate-400 mt-0.5">集团协议托管</div>
                                        </td>
                                        <td className="px-6 py-4 text-slate-600">
                                            <div className="font-mono">¥{(report.hotel.laborAmount/10000).toFixed(2)}W</div>
                                        </td>
                                    </tr>
                                    <tr className="hover:bg-slate-50 transition-colors">
                                        <td className="px-6 py-4 font-bold text-slate-700 flex items-center gap-2">
                                            <Icon name="train" className="text-purple-500" size={16}/> 火车
                                        </td>
                                        <td className="px-6 py-4 font-mono text-slate-600">¥{(report.train.budget/10000).toFixed(1)}W</td>
                                        <td className="px-6 py-4 font-mono font-bold text-purple-600 bg-blue-50/10">
                                            ¥{(report.train.total/10000).toFixed(1)}W
                                            <span className="ml-2 text-xs font-normal bg-purple-100 text-purple-700 px-1.5 py-0.5 rounded">{(report.train.roi * 100).toFixed(1)}%</span>
                                        </td>
                                        <td className="px-6 py-4 text-slate-600">
                                            <div className="font-mono">¥{(report.train.controlAmount/10000).toFixed(2)}W</div>
                                            <div className="text-[10px] text-slate-400 mt-0.5">二等座合规</div>
                                        </td>
                                        <td className="px-6 py-4 text-slate-400 italic">
                                            <div className="font-mono">-</div>
                                            <div className="text-[10px] mt-0.5">无资源空间</div>
                                        </td>
                                        <td className="px-6 py-4 text-slate-600">
                                            <div className="font-mono">¥{(report.train.laborAmount/10000).toFixed(2)}W</div>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                        <div className="bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
                            <div className="flex items-center justify-between mb-6">
                                <h4 className="font-bold text-slate-800 flex items-center gap-2">
                                    <Icon name="plane" className="text-blue-500" size={18}/> 航司协议资源模拟
                                </h4>
                                <span className="text-[10px] uppercase bg-slate-100 text-slate-500 px-2 py-1 rounded">Based on Budget</span>
                            </div>
                            <div className="space-y-4">
                                <div className="text-xs text-slate-500 mb-2">系统根据您的预算规模 ¥{(report.air.budget/10000).toFixed(0)}W，自动匹配最优协议组合：</div>
                                {[
                                    { name: '中国国航', share: 25, discount: 5 },
                                    { name: '南方航空', share: 20, discount: 4 },
                                    { name: '东方航空', share: 20, discount: 4 },
                                    { name: '其他航司', share: 35, discount: 0 }
                                ].map((airline, idx) => {
                                    const airlineBudget = report.air.budget * (airline.share / 100);
                                    const saving = airlineBudget * (airline.discount / 100);
                                    return (
                                        <div key={idx} className="flex items-center justify-between text-sm group p-2 hover:bg-slate-50 rounded transition-colors border-b border-transparent hover:border-slate-100">
                                            <div className="flex items-center gap-3 w-1/3">
                                                <div className={`w-2 h-2 rounded-full ${airline.discount > 0 ? 'bg-blue-500' : 'bg-slate-300'}`}></div>
                                                <span className="font-medium text-slate-700">{airline.name}</span>
                                            </div>
                                            <div className="w-1/3 text-center text-slate-500 text-xs">份额 {airline.share}%</div>
                                            <div className="w-1/3 text-right font-mono font-medium text-slate-800">
                                                {saving > 0 ? `节省 ¥${Math.round(saving).toLocaleString()}` : <span className="text-slate-300">-</span>}
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                            <div className="mt-6 p-3 bg-blue-50 rounded-lg text-xs text-blue-700 flex gap-2 items-start">
                                <div className="mt-0.5"><Icon name="info" size={14}/></div>
                                <span>当机票预算 >500万 时，建议签署三方协议，预估可额外降低 4%-8% 成本。</span>
                            </div>
                        </div>

                        <div className="bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
                            <div className="flex items-center justify-between mb-6">
                                <h4 className="font-bold text-slate-800 flex items-center gap-2">
                                    <Icon name="building" className="text-emerald-500" size={18}/> 酒店集团分布优化
                                </h4>
                                <span className="text-[10px] uppercase bg-slate-100 text-slate-500 px-2 py-1 rounded">Mix Optimization</span>
                            </div>
                            <div className="space-y-6">
                                <div className="space-y-3">
                                    <div className="flex justify-between text-xs text-slate-500 mb-1">
                                        <span>华住集团 (优化潜力高)</span>
                                        <span className="text-emerald-600 font-bold">目标占比 35%</span>
                                    </div>
                                    <div className="h-3 bg-slate-100 rounded-full overflow-hidden flex">
                                        <div className="h-full bg-emerald-500 w-[35%]"></div>
                                        <div className="h-full bg-slate-200 w-[65%]"></div>
                                    </div>
                                    <p className="text-[10px] text-slate-400 text-right">若集中度提升至 35%，协议价可覆盖 ¥{(report.hotel.budget * 0.35 / 10000).toFixed(1)}W 支出</p>
                                </div>
                                <div className="space-y-3">
                                    <div className="flex justify-between text-xs text-slate-500 mb-1">
                                        <span>锦江/亚朵 (补充资源)</span>
                                        <span className="text-emerald-600 font-bold">目标占比 25%</span>
                                    </div>
                                    <div className="h-3 bg-slate-100 rounded-full overflow-hidden flex">
                                        <div className="h-full bg-emerald-400 w-[25%]"></div>
                                        <div className="h-full bg-slate-200 w-[75%]"></div>
                                    </div>
                                </div>
                                <div className="space-y-3">
                                    <div className="flex justify-between text-xs text-slate-500 mb-1">
                                        <span>长尾/单体酒店 (无协议)</span>
                                        <span className="text-amber-500 font-bold">压缩至 40%</span>
                                    </div>
                                    <div className="h-3 bg-slate-100 rounded-full overflow-hidden flex">
                                        <div className="h-full bg-slate-300 w-[40%]"></div>
                                        <div className="h-full bg-slate-100 w-[60%]"></div>
                                    </div>
                                </div>
                            </div>
                            <div className="mt-6 p-3 bg-emerald-50 rounded-lg text-xs text-emerald-800 border border-emerald-100 flex gap-2 items-start">
                                <div className="mt-0.5"><Icon name="alertCircle" size={14}/></div>
                                <div><strong>策略建议：</strong> 当前数据模型显示，通过将零散订单向头部集团归集（集中度从自然分布提升至60%），结合平台托管协议，可直接带来 <strong>¥{(report.hotel.resourceAmount / 10000).toFixed(1)}万</strong> 的硬性成本下降。</div>
                            </div>
                        </div>
                    </div>
                </div>
            );

            // Tab 3: 计算公式与业务逻辑
            const renderLogic = () => (
                <div className="p-6 bg-white rounded-xl shadow-sm border border-slate-200 transition-all duration-500">
                    <div className="flex items-center mb-6 gap-2 text-indigo-600 border-b pb-4">
                        <Icon name="calculator" size={20} />
                        <h2 className="text-lg font-bold"> 商旅节省预估模型 (计算公式与业务逻辑)</h2>
                    </div>
                    <div className="overflow-x-auto no-scrollbar">
                        <table className="min-w-full border-collapse">
                            <thead className="bg-slate-50 text-slate-500 text-xs font-bold uppercase tracking-wider">
                                <tr>
                                    <th className="px-4 py-3 border text-left whitespace-nowrap">模块名称</th>
                                    <th className="px-4 py-3 border text-left whitespace-nowrap">组成部分</th>
                                    <th className="px-4 py-3 border text-left">计算公式 (Quantification Formula)</th>
                                    <th className="px-4 py-3 border text-left">逻辑说明</th>
                                </tr>
                            </thead>
                            <tbody className="text-sm">
                                <tr>
                                    <td className="px-4 py-4 border font-bold text-slate-700 bg-slate-50/50" rowSpan="2">
                                        <div className="flex items-center gap-1"><Icon name="plane" size={14}/> 机票节省</div>
                                    </td>
                                    <td className="px-4 py-4 border font-medium text-slate-900">机票管控节省</td>
                                    <td className="px-4 py-4 border font-mono text-indigo-600 text-[11px]">
                                        • 最低价管控 = 标价 - 销售价 (12%)<br/>
                                        • 提前预订 = 销售价 * 提前预订折扣率 (3%)
                                    </td>
                                    <td className="px-4 py-4 border text-slate-500 text-xs leading-relaxed">
                                        通过系统规则强迫员工做出更省钱的选择。
                                    </td>
                                </tr>
                                <tr>
                                    <td className="px-4 py-4 border font-medium text-slate-900">机票资源节省</td>
                                    <td className="px-4 py-4 border font-mono text-indigo-600 text-[11px]">
                                        • 大客户协议 = 标价 - 协议价 (4%)<br/>
                                        • 航司返点 = 消费额 * 返点率 (2.2%)
                                    </td>
                                    <td className="px-4 py-4 border text-slate-500 text-xs leading-relaxed">
                                        凭借平台与航司的集团协议价、平台专属补贴带来的价格优势。
                                    </td>
                                </tr>
                                
                                <tr className="bg-slate-50/20">
                                    <td className="px-4 py-4 border font-bold text-slate-700 bg-slate-50/50" rowSpan="2">
                                        <div className="flex items-center gap-1"><Icon name="building" size={14}/> 酒店节省</div>
                                    </td>
                                    <td className="px-4 py-4 border font-medium text-slate-900">酒店管控节省</td>
                                    <td className="px-4 py-4 border font-mono text-indigo-600 text-[11px]">
                                        • 差标硬控制 (12%) <br/>
                                        • 违规强管控 (4.9%)
                                    </td>
                                    <td className="px-4 py-4 border text-slate-500 text-xs leading-relaxed">
                                        通过系统强制执行差旅标准和同性合住规则，避免超额消费。
                                    </td>
                                </tr>
                                <tr className="bg-slate-50/20">
                                    <td className="px-4 py-4 border font-medium text-slate-900">酒店资源节省</td>
                                    <td className="px-4 py-4 border font-mono text-indigo-600 text-[11px]">
                                        • 协议价托管 = 40%覆盖率 * 20%优惠
                                    </td>
                                    <td className="px-4 py-4 border text-slate-500 text-xs leading-relaxed">
                                        通过将零散订单向华住、锦江等头部集团归集，获取集团协议价。
                                    </td>
                                </tr>

                                <tr className="bg-indigo-50/30">
                                    <td className="px-4 py-4 border font-bold text-indigo-700 bg-indigo-50/50">
                                        <div className="flex items-center gap-1"><Icon name="clock" size={14}/> 人力节省</div>
                                    </td>
                                    <td className="px-4 py-4 border font-medium text-slate-900">报销人力节省</td>
                                    <td className="px-4 py-4 border font-mono text-indigo-700 text-[11px] bg-white p-2 border-indigo-200 shadow-inner">
                                        ({inputData.efficiency.oldTime}min - {inputData.efficiency.newTime}min * 总单量) / 60 / 8 / 21 * 月薪
                                    </td>
                                    <td className="px-4 py-4 border text-slate-500 text-xs leading-relaxed">
                                        将节省的员工报销操作与财务审核时间 ({inputData.efficiency.oldTime}min - {inputData.efficiency.newTime}min)，折算为等效人力成本。
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    <div className="mt-4 p-4 bg-slate-900 rounded-lg text-white font-mono text-xs">
                        <span className="text-emerald-400 font-bold">顶层汇总逻辑：</span> 
                        总节省 = 机票节省金额 + 酒店节省金额 + 人力节省金额 | 节省率 = (分项节省 / 分项消费) * 100%
                    </div>
                </div>
            );

            const tabs = [
                { id: 'input', label: '1. 数据录入', icon: 'database' },
                { id: 'analysis', label: '2. 智能分析', icon: 'pieChart' },
                { id: 'logic', label: '3. 计算公式与业务逻辑', icon: 'calculator' }
            ];

            return (
                <div className="min-h-screen pb-20">
                    <header className="bg-white border-b border-slate-200 sticky top-0 z-50 shadow-sm">
                        <div className="max-w-6xl mx-auto px-4 py-3 flex flex-col md:flex-row md:items-center justify-between gap-4">
                            <div className="flex items-center gap-2">
                                <div className="bg-blue-600 text-white p-1.5 rounded-lg shadow-sm">
                                    <Icon name="trendingUp" size={20} />
                                </div>
                                <span className="font-bold text-lg tracking-tight text-slate-800">ROI 智能建模引擎 <span className="text-slate-400 font-normal text-xs ml-1">v3.0 单文件版</span></span>
                            </div>
                            <nav className="flex flex-wrap bg-slate-100 p-1 rounded-lg w-full md:w-auto overflow-x-auto no-scrollbar">
                                {tabs.map(tab => (
                                    <button
                                        key={tab.id}
                                        onClick={() => setActiveTab(tab.id)}
                                        className={`flex-shrink-0 flex items-center gap-2 px-3 py-2 rounded-md text-sm font-medium transition-all ${
                                            activeTab === tab.id ? 'bg-white text-blue-600 shadow-sm' : 'text-slate-500 hover:text-slate-700'
                                        }`}
                                    >
                                        <Icon name={tab.icon} size={14} />
                                        {tab.label}
                                    </button>
                                ))}
                            </nav>
                        </div>
                    </header>
                    <main className="max-w-6xl mx-auto px-4 py-8">
                        {activeTab === 'input' && renderInput()}
                        {activeTab === 'analysis' && renderAnalysis()}
                        {activeTab === 'logic' && renderLogic()}
                    </main>
                </div>
            );
        };

        // 挂载到 DOM
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<SmartROIEngine />);
    </script>
</body>

</html>
